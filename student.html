<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;color:#d4a017;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:20px;padding-bottom:70px}
a{color:#5aa0d0;text-decoration:none}
a:hover{text-decoration:underline}


/* Dashboard */
.dashboard{width:100%;max-width:600px}
.dash-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.dash-header h2{font-size:16px;color:#f0c030}
.dash-header .user-info{font-size:12px;color:#888}
.logout-btn{background:none;border:1px solid #444;color:#888;border-radius:6px;padding:4px 12px;font-size:11px;cursor:pointer}
.logout-btn:hover{border-color:#d4a017;color:#d4a017}

.sub-card{background:#242424;border:1px solid #3a3a3a;border-radius:10px;margin-bottom:10px;overflow:hidden}
.sub-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;user-select:none}
.sub-header:hover{background:#2a2a2a}
.sub-title{display:flex;align-items:center;gap:10px}
.sub-badge{background:#2e2000;border:1px solid #7a5c00;color:#d4a017;border-radius:6px;padding:3px 10px;font-size:13px;font-weight:700}
.sub-label{font-size:13px;color:#ccc}
.sub-status{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:600}
.st-P{background:#2a3a1e;color:#7ec850;border:1px solid #4a7a2a}
.st-F{background:#1e2a3a;color:#5aa0d0;border:1px solid #2a5a8a}
.st-G{background:#2a1e3a;color:#a07ed0;border:1px solid #5a3a8a}
.st-S{background:#3a1e1e;color:#e07070;border:1px solid #8a2a2a}
.st-{background:#2a2a2a;color:#555;border:1px solid #333}
.chevron{color:#555;font-size:14px;transition:transform .2s}
.chevron.open{transform:rotate(90deg);color:#d4a017}

.sub-body{display:none;padding:0 16px 14px;border-top:1px solid #2a2a2a}
.sub-body.open{display:block}
.session-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.session-chip{font-size:12px;color:#5aa0d0;border:1px solid #2a5a8a;border-radius:6px;padding:4px 12px;cursor:pointer;user-select:none}
.session-chip:hover{background:#1e2a3a}
.session-note{font-size:12px;color:#aaa;line-height:1.6;padding:8px 0}
.no-sessions{font-size:12px;color:#555;padding:10px 0}
.player-box{margin-top:12px;display:none}
.player-loading{font-size:12px;color:#888;padding:8px 0}
.player-err{font-size:12px;color:#e07070;padding:8px 0}
.player-pass{font-size:13px;color:#d4a017;background:#2a2200;border:1px solid #7a5c00;border-radius:6px;padding:8px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.player-pass strong{letter-spacing:3px;color:#f0c030;font-size:16px}
.copy-btn{background:#3a2e00;color:#d4a017;border:1px solid #7a5c00;border-radius:5px;padding:3px 10px;font-size:11px;cursor:pointer}
.copy-btn:hover{border-color:#f0c030}
.player-embed{width:100%;aspect-ratio:16/9;border-radius:8px;overflow:hidden;margin-top:4px}
.player-embed iframe{width:100%;height:100%;border:none}
.month-info{font-size:11px;color:#666;margin-top:4px}

/* Contact bar (logged in) */
.contact-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:90%;max-width:560px;background:#1e1e1e;border:1px solid #333;border-bottom:none;border-radius:10px 10px 0 0;z-index:500;display:none}
.contact-tab{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;cursor:pointer;-webkit-user-select:none;user-select:none}
.contact-tab:hover{background:#242424}
.contact-tab-label{font-size:12px;color:#d4a017;font-weight:600}
.contact-chevron{color:#555;font-size:11px;transition:transform .2s}
.contact-chevron.open{transform:rotate(180deg);color:#d4a017}
.contact-form{display:none;padding:12px 16px;border-top:1px solid #2a2a2a}
.contact-form.open{display:block}
.contact-form input,.contact-form textarea{width:100%;background:#111;border:1px solid #3a3a3a;border-radius:6px;color:#d4a017;font-size:13px;padding:8px 10px;outline:none;font-family:inherit;margin-bottom:8px}
.contact-form input:focus,.contact-form textarea:focus{border-color:#d4a017}
.contact-form input::placeholder,.contact-form textarea::placeholder{color:#555}
.contact-form textarea{resize:vertical;min-height:80px}
.contact-form-row{display:flex;gap:8px;align-items:center}
.contact-send{background:#2a2a2a;color:#d4a017;border:1px solid #555;border-radius:6px;padding:8px 20px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.contact-send:hover{border-color:#d4a017}
.contact-send:disabled{opacity:.5;cursor:not-allowed}
.contact-msg{font-size:11px;flex:1}


/* Nav bar */
.nav-bar{display:flex;justify-content:flex-end;gap:6px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.nav-btn{background:#2a2a2a;color:#d4a017;border:1px solid #444;border-radius:6px;padding:5px 13px;font-size:12px;cursor:pointer;font-weight:600;font-family:inherit}
.nav-btn:hover{border-color:#d4a017;background:#333}
.nav-btn.nb-student{color:#e07070;border-color:#6a2a2a}
.nav-btn.nb-student:hover{background:#3a1e1e;border-color:#e07070}
.lang-toggle{display:flex;gap:2px;margin-right:4px}
.lang-btn{background:#1e1e1e;border:1px solid #3a3a3a;border-radius:5px;padding:3px 9px;font-size:12px;cursor:pointer;color:#666;font-family:inherit;transition:all .15s}
.lang-btn.active{border-color:#d4a017;color:#d4a017;background:#2a2200}
.lang-btn:hover:not(.active){border-color:#555;color:#999}

/* Popup */
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:none;align-items:center;justify-content:center}
.popup-overlay.open{display:flex}
.popup-box{position:relative;width:90vw;height:90vh;background:#111;border-radius:10px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.8)}
.popup-close{position:absolute;top:8px;right:10px;z-index:10;background:#3a3a3a;color:#d4a017;border:1px solid #555;border-radius:6px;padding:4px 14px;font-size:13px;cursor:pointer;font-weight:700;font-family:inherit}
.popup-close:hover{background:#555;border-color:#d4a017}
.popup-frame{width:100%;height:100%;border:none;display:block}
.pay-now-btn{background:#2a2000;border:1px solid #7a5c00;color:#f0c030;border-radius:6px;padding:2px 10px;font-size:11px;font-family:inherit;cursor:pointer;font-weight:600}
.pay-now-btn:hover{background:#3a3000;border-color:#d4a017}
</style>
</head>
<body>


<div id="loader" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:12px">
  <div style="font-size:48px;animation:spin 1.4s linear infinite">⏳</div>
</div>
<style>@keyframes spin{0%{transform:rotate(0deg)}50%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}</style>

<!-- Dashboard -->
<div class="dashboard" id="dashboard" style="display:none">
  <div class="dash-header">
    <div>
      <h2 id="dashName"></h2>
      <div class="user-info" id="dashEmail"></div>
    </div>
  </div>
  <div class="nav-bar">
    <div class="lang-toggle">
      <button class="lang-btn" id="langRO" onclick="setLang('ro')">🇷🇴</button>
      <button class="lang-btn" id="langEN" onclick="setLang('en')">🇬🇧</button>
    </div>
    <button class="nav-btn nb-student" id="btnLogout" onclick="logout()">Logout</button>
    <button class="nav-btn" id="btnEvents" onclick="openPopup('https://nicolaecatrina.com/events-calendar')">Events</button>
    <button class="nav-btn" id="btnOndemand" onclick="openPopup('https://nicolaecatrina.com/en/online-ondemand-classes-and-modules/')">On-demand</button>
    <button class="nav-btn" id="btnOngoing" onclick="openPopup('https://nicolaecatrina.com/en/ongoing-courses-online/')">Ongoing</button>
  </div>
  <div id="subsList"></div>
</div>


<!-- Contact bar (logged in) -->
<div class="contact-bar" id="contactBar">
  <div class="contact-tab" onclick="toggleContactBar()">
    <span class="contact-tab-label" id="contactTabLabel">✉ Contact Teacher</span>
    <span class="contact-chevron" id="contactChevron">▲</span>
  </div>
  <div class="contact-form" id="contactForm">
    <input type="text" id="contactSubject" placeholder="Subject">
    <textarea id="contactMessage" placeholder="Your message…"></textarea>
    <div class="contact-form-row">
      <button type="button" class="contact-send" id="contactSend" onclick="sendContactEmail()">Send</button>
      <span class="contact-msg" id="contactMsgEl"></span>
    </div>
  </div>
</div>

<!-- Popup -->
<div class="popup-overlay" id="popupOverlay" onclick="handleOverlayClick(event)">
  <div class="popup-box">
    <button class="popup-close" id="popupCloseBtn" onclick="closePopup()">✕ Close</button>
    <iframe class="popup-frame" id="popupFrame" src="" allowfullscreen></iframe>
  </div>
</div>

<script>
var PROXY = /^\/app(\/|$)/.test(location.pathname)
  ? location.origin + '/app/airtable-proxy.php'
  : location.origin + '/airtable-proxy.php';
var student = null;
var courses = [];
var sessions = [];
var ks2026Enrollments = {};

var BASE = /^\/app(\/|$)/.test(location.pathname) ? '/app/' : '/';

var GUEST_WORKSHOPS = {
  'taoist-alchemy': {
    label: 'Module 1',
    videos: [
      {session: 'Session 1', id: '471560713'},
      {session: 'Session 2', id: '471745895'},
      {session: 'Session 3', id: '471859106'},
      {session: 'Session 4', id: '471861307'},
      {session: 'Session 5', id: '471907879'},
      {session: 'Session 6', id: '472088309'}
    ]
  }
};

var COURSE_PAY_URLS = {
  'YTT-M1': 'https://nicolaecatrina.com/yoga-tantrica-tibetana-curs-online-modulul-1/',
  'YTT-M2': 'https://nicolaecatrina.com/yoga-tantrica-tibetana-curs-online-modulul-2/',
  'YTT-M3': 'https://nicolaecatrina.com/ytt-m3/',
  'I Ching': 'https://nicolaecatrina.com/iching/',
  'AL': 'https://nicolaecatrina.com/curs-de-initiere-in-misterele-traditiei-alchimice-universale/'
};

var lang = localStorage.getItem('lang') || 'ro';

var T = {
  en: {
    logout: 'Logout',
    events: 'Events',
    ondemand: 'On-demand courses/modules',
    ongoing: 'Ongoing courses',
    welcome: 'Welcome, ',
    contactTeacher: '✉ Contact',
    subjectPlaceholder: 'Subject',
    messagePlaceholder: 'Your message…',
    send: 'Send',
    close: '✕ Close',
    months: ['January','February','March','April','May','June','July','August','September','October','November','December'],
    statusNotPaid: 'Not paid',
    statusPaid: 'Paid',
    statusFull: 'Full',
    statusStopped: 'Stopped',
    payNow: 'Pay now',
    noSessions: 'No sessions available yet',
    noSubs: 'No active course subscription found',
    loading: 'Loading ',
    password: 'Password:',
    copy: 'Copy',
    networkError: 'Network error',
    fillSubjectMessage: 'Fill in subject and message',
    sending: 'Sending…',
    messageSent: 'Message sent!',
    failedToSend: 'Failed to send',
    ksTypeLabel: function(hasLive, hasReplay) {
      return (hasLive && hasReplay) ? 'live + replay' : (hasReplay ? 'replay' : 'live');
    },
    ksParticipated: function(hasLive, hasReplay) {
      return 'Participated ' + this.ksTypeLabel(hasLive, hasReplay);
    },
    ytt3g1Notice: 'Dear students, you will receive the next two courses (107, 108) as soon as they are ready for viewing. Thank you for your understanding!',
  },
  ro: {
    logout: 'Deconectare',
    events: 'Evenimente',
    ondemand: 'Cursuri/module la cerere',
    ongoing: 'Cursuri în desfășurare',
    welcome: 'Bun venit, ',
    contactTeacher: '✉ Contact',
    subjectPlaceholder: 'Subiect',
    messagePlaceholder: 'Mesajul tău…',
    send: 'Trimite',
    close: '✕ Închide',
    months: ['Ianuarie','Februarie','Martie','Aprilie','Mai','Iunie','Iulie','August','Septembrie','Octombrie','Noiembrie','Decembrie'],
    statusNotPaid: 'Neachitat',
    statusPaid: 'Achitat',
    statusFull: 'Achitat',
    statusStopped: 'Oprit',
    payNow: 'Plătesc acum',
    noSessions: 'Nicio sesiune disponibilă',
    noSubs: 'Niciun abonament activ găsit',
    loading: 'Se încarcă ',
    password: 'Parolă:',
    copy: 'Copiază',
    networkError: 'Eroare de rețea',
    fillSubjectMessage: 'Completați subiectul și mesajul',
    sending: 'Se trimite…',
    messageSent: 'Mesaj trimis!',
    failedToSend: 'Trimitere eșuată',
    ksTypeLabel: function(hasLive, hasReplay) {
      return (hasLive && hasReplay) ? 'live + replay' : (hasReplay ? 'replay' : 'live');
    },
    ksParticipated: function(hasLive, hasReplay) {
      return 'Ai participat ' + (this.ksTypeLabel(hasLive, hasReplay) === 'replay' ? 'prin reluare' : this.ksTypeLabel(hasLive, hasReplay));
    },
    ytt3g1Notice: 'Dragi studenți, următoarele două cursuri (107, 108) le veți primi imediat ce vor fi pregătite pentru vizionare. Vă mulțumim pentru înțelegere!',
  }
};

function t() { return T[lang]; }

function applyLang() {
  var tr = t();
  var el;
  if ((el = document.getElementById('btnLogout')))    el.textContent = tr.logout;
  if ((el = document.getElementById('btnEvents')))    el.textContent = tr.events;
  if ((el = document.getElementById('btnOndemand')))  el.textContent = tr.ondemand;
  if ((el = document.getElementById('btnOngoing')))   el.textContent = tr.ongoing;
  if ((el = document.getElementById('contactTabLabel'))) el.textContent = tr.contactTeacher;
  if ((el = document.getElementById('contactSubject')))  el.placeholder = tr.subjectPlaceholder;
  if ((el = document.getElementById('contactMessage')))  el.placeholder = tr.messagePlaceholder;
  if ((el = document.getElementById('contactSend')))     el.textContent = tr.send;
  if ((el = document.getElementById('popupCloseBtn')))   el.textContent = tr.close;
  var ro = document.getElementById('langRO'), en = document.getElementById('langEN');
  if (ro) { ro.classList.toggle('active', lang === 'ro'); }
  if (en) { en.classList.toggle('active', lang === 'en'); }
  document.documentElement.lang = lang;
}

function setLang(l) {
  lang = l;
  localStorage.setItem('lang', l);
  applyLang();
  if (student) showDashboard();
}


async function loadCourseData() {
  try {
    var cr = await fetch(PROXY + '?action=courses').then(function(r){return r.json();});
    courses = (cr.records || []).map(function(r){
      var f = r.fields || {};
      return {id: f.id || '', label: f.label || '', groups: (f.groups || 'All').split(',')};
    });
  } catch(e) { courses = []; }
  try {
    var sr = await fetch(PROXY + '?action=sessions').then(function(r){return r.json();});
    sessions = (sr.records || []).map(function(r){
      var f = r.fields || {};
      return {id: f.id || '', session: f.session || '', link: f.link || '', email: (f.email || '').toLowerCase()};
    });
  } catch(e) { sessions = []; }
  try {
    var kr = await fetch(PROXY + '?action=ks2026').then(function(r){return r.json();});
    ks2026Enrollments = kr.enrollments || {};
  } catch(e) { ks2026Enrollments = {}; }
}

function showDashboard() {
  document.getElementById('loader').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('contactBar').style.display = 'block';
  applyLang();

  var tr = t();
  var f = student.fields || {};
  var name = f.name || 'Student';
  var email = f.email || '';
  document.getElementById('dashName').textContent = tr.welcome + name;
  document.getElementById('dashEmail').textContent = email;

  var subs = {};
  try { subs = JSON.parse(f.subscriptions || '{}'); } catch(e) {}

  var MN = tr.months;
  var mo = new Date().getMonth();
  var currMonth = MN[mo];
  var nextMonth = MN[(mo+1)%12];

  var studentEmail = (f.email || '').toLowerCase();
  var studentNote = (f.note || '').trim();
  var ksData = ks2026Enrollments[studentEmail] || {};
  var ksSessions = ksData.sessions || [];
  var ksTax = ksData.tax || '';
  var isKsPaid = ksTax && ksTax !== 'pending';
  var isKsEnrolled = ksSessions.length > 0 && isKsPaid;
  var hasLive   = ksSessions.indexOf('live')   >= 0;
  var hasReplay = ksSessions.indexOf('replay') >= 0;
  var ksCard = '';
  if (isKsEnrolled) {
    ksCard = '<div class="sub-card">';
    ksCard += '<div class="sub-header">';
    ksCard += '<div class="sub-title">';
    ksCard += '<span class="sub-badge" style="background:#0d2040;border-color:#2a6a9a;color:#5ab0e0">KS2026</span>';
    ksCard += '<span class="sub-label">' + tr.ksParticipated(hasLive, hasReplay) + '</span>';
    ksCard += '</div><div style="display:flex;align-items:center;gap:10px"></div></div>';
    ksCard += '</div>';
  }
  var html = ksCard;
  var hasCourseSubs = false;
  courses.forEach(function(c) {
    var sub = subs[c.id];
    if (!sub) return;
    hasCourseSubs = true;

    var currStatus = sub.curr || '';
    var nextStatus = sub.next || '';
    var statusText = currStatus ? statusLabel(currStatus) : '—';
    var currLetter = currStatus.replace(/\d+$/, '');
    var statusClass = 'st-' + currLetter;
    var isPaid = currLetter === 'P' || currLetter === 'F' || currLetter === 'G';
    var isPrivate = !isPaid && studentNote.length > 0;

    var groupId = c.id + '-G' + (sub.G || '');
    var courseSessions = [];
    if (isPaid && sub.G) {
      var allGroupSess = sessions.filter(function(s){ return s.id === groupId; });
      var privateMap = {};
      allGroupSess.forEach(function(s){
        if(s.email && s.email === studentEmail) privateMap[s.session] = true;
      });
      allGroupSess.forEach(function(s){
        if(!s.email) {
          if(!privateMap[s.session]) courseSessions.push(s);
        } else if(s.email === studentEmail) {
          courseSessions.push(s);
        }
      });
    } else if (isPrivate) {
      courseSessions = sessions.filter(function(s){
        return s.id.indexOf(c.id) === 0 && s.email === studentEmail;
      });
    }
    courseSessions.sort(function(a, b) {
      var na = parseInt((a.session || '').replace(/\D/g,'')) || 0;
      var nb = parseInt((b.session || '').replace(/\D/g,'')) || 0;
      return na - nb;
    });

    html += '<div class="sub-card">';
    html += '<div class="sub-header" onclick="toggleSub(this)">';
    html += '<div class="sub-title">';
    html += '<span class="sub-badge">' + esc(c.id) + '</span>';
    html += '<span class="sub-label">' + (sub.G ? 'G' + esc(sub.G) : esc(c.label)) + '</span>';
    html += '</div>';
    html += '<div style="display:flex;align-items:center;gap:10px">';
    html += '<span class="sub-status ' + statusClass + '">' + statusText + '</span>';
    html += '<span class="chevron">▶</span>';
    html += '</div>';
    html += '</div>';
    html += '<div class="sub-body">';
    if (c.id === 'TTY-M3') {
      html += '<div class="session-note" style="background:#2a2410;border:1px solid #6a5a1a;color:#e0c060;padding:10px;border-radius:6px;margin-bottom:10px">Dear students, due to the Costinești holiday, editing this month’s course materials is taking a bit longer than usual, so they will be available on the platform in a few days. Thank you for your understanding!</div>';
    }
    if (c.id === 'YTT-M3' && String(sub.G) === '1') {
      html += '<div class="session-note" style="background:#2a2410;border:1px solid #6a5a1a;color:#e0c060;padding:10px;border-radius:6px;margin-bottom:10px">' + tr.ytt3g1Notice + '</div>';
    }
    var payUrl = COURSE_PAY_URLS[c.id];
    var nextPart;
    if (currStatus === 'F') {
      nextPart = nextMonth + ': ' + tr.statusPaid;
    } else if (currStatus === 'F1' && payUrl) {
      nextPart = '<a class="pay-now-btn" href="' + esc(payUrl) + '" target="_blank" rel="noopener">' + nextMonth + ': ' + tr.payNow + '</a>';
    } else if (!nextStatus && payUrl) {
      nextPart = '<a class="pay-now-btn" href="' + esc(payUrl) + '" target="_blank" rel="noopener">' + nextMonth + ': ' + tr.payNow + '</a>';
    } else {
      nextPart = nextMonth + ': ' + statusLabel(nextStatus);
    }
    html += '<div class="month-info">' + currMonth + ': ' + statusLabel(currStatus) + ' · ' + nextPart + '</div>';

    if (isPaid || isPrivate) {
      if (courseSessions.length > 0) {
        var textSessions = courseSessions.filter(function(s){ return !s.link || s.link === '#'; });
        var linkSessions  = courseSessions.filter(function(s){ return s.link && s.link !== '#'; });
        textSessions.forEach(function(s) {
          html += '<div class="session-note">' + esc(s.session) + '</div>';
        });
        if (linkSessions.length > 0) {
          html += '<div class="session-list">';
          linkSessions.forEach(function(s) {
            html += '<span class="session-chip" data-cid="' + esc(c.id) + '" data-sess="' + esc(s.session) + '" data-url="' + esc(s.link) + '" onclick="playSession(this)">' + esc(s.session) + '</span>';
          });
          html += '</div>';
        }
        html += '<div class="player-box" id="pb_' + c.id.replace(/[^a-zA-Z0-9]/g,'_') + '"></div>';
      } else if (isPaid) {
        html += '<div class="no-sessions">' + tr.noSessions + '</div>';
      }
    }

    html += '</div>';
    html += '</div>';
  });

  if (!hasCourseSubs) html += '<div class="no-sessions" style="text-align:center;padding:30px">' + tr.noSubs + '</div>';
  document.getElementById('subsList').innerHTML = html;
}

function showGuestDashboard(key) {
  document.getElementById('loader').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('contactBar').style.display = 'block';
  document.querySelector('.nav-bar').style.display = 'none';
  applyLang();
  document.getElementById('dashName').textContent = 'Guest';
  document.getElementById('dashEmail').textContent = '';
  var wf = GUEST_WORKSHOPS[key];
  if (!wf) {
    document.getElementById('subsList').innerHTML = '<div class="no-sessions" style="text-align:center;padding:30px">Not found</div>';
    return;
  }
  var html = '<div class="sub-card"><div class="sub-header"><div class="sub-title">';
  html += '<span class="sub-badge">' + esc(wf.label) + '</span></div></div>';
  html += '<div class="sub-body open">';
  html += '<div class="session-list">';
  wf.videos.forEach(function(v) {
    html += '<span class="session-chip" data-cid="' + esc(key) + '" data-sess="' + esc(v.session) + '" data-url="' + esc('https://vimeo.com/' + v.id) + '" onclick="playSession(this)">' + esc(v.session) + '</span>';
  });
  html += '</div>';
  html += '<div class="player-box" id="pb_' + safeId(key) + '"></div>';
  html += '</div></div>';
  document.getElementById('subsList').innerHTML = html;
}

function toggleSub(el) {
  var body = el.nextElementSibling;
  var chevron = el.querySelector('.chevron');
  var isOpen = body.classList.contains('open');
  document.querySelectorAll('.sub-body').forEach(function(b){b.classList.remove('open');});
  document.querySelectorAll('.chevron').forEach(function(c){c.classList.remove('open');});
  if (!isOpen) {
    body.classList.add('open');
    chevron.classList.add('open');
  }
}

function logout() {
  student = null;
  sessionStorage.removeItem('student');
  sessionStorage.removeItem('loginCode');
  window.location.href = BASE + 'login.html';
}

function statusLabel(s) {
  var tr = t();
  if (!s) return tr.statusNotPaid;
  var letter = s.replace(/\d+$/, '');
  return {P: tr.statusPaid, F: tr.statusFull, G: tr.statusPaid, S: tr.statusStopped}[letter] || s;
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function safeId(s) { return s.replace(/[^a-zA-Z0-9]/g,'_'); }

async function playSession(el) {
  var courseId = el.dataset.cid, label = el.dataset.sess, url = el.dataset.url;
  var box = document.getElementById('pb_' + safeId(courseId));
  if (!box) return;
  var tr = t();
  box.style.display = 'block';
  box.innerHTML = '<div class="player-loading">' + tr.loading + esc(label) + '…</div>';
  try {
    var res = await fetch(PROXY + '?action=vimeo_play', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({url: url})
    }).then(function(r){return r.json();});
    if (res.error) { box.innerHTML = '<div class="player-err">' + esc(res.error) + '</div>'; return; }
    var sid = safeId(courseId);
    box.innerHTML =
      '<div class="player-pass">' +
        '<span>' + tr.password + '</span>' +
        '<strong id="vpass_' + sid + '">' + esc(res.password) + '</strong>' +
        '<button class="copy-btn" onclick="copyPass(\'' + sid + '\')">' + tr.copy + '</button>' +
      '</div>' +
      '<div class="player-embed">' + res.embed + '</div>';
  } catch(e) { box.innerHTML = '<div class="player-err">' + tr.networkError + '</div>'; }
}

async function copyPass(sid) {
  var el = document.getElementById('vpass_' + sid);
  if (!el) return;
  try {
    await navigator.clipboard.writeText(el.textContent);
    el.style.color = '#7ec850';
    setTimeout(function(){ el.style.color = ''; }, 1500);
  } catch(e) {}
}

function openPopup(url) {
  document.getElementById('popupFrame').src = url;
  document.getElementById('popupOverlay').classList.add('open');
}
function closePopup() {
  document.getElementById('popupOverlay').classList.remove('open');
  document.getElementById('popupFrame').src = '';
}
function handleOverlayClick(e) {
  if (e.target === document.getElementById('popupOverlay')) closePopup();
}


function toggleContactBar() {
  var form = document.getElementById('contactForm');
  var chevron = document.getElementById('contactChevron');
  var isOpen = form.classList.contains('open');
  form.classList.toggle('open', !isOpen);
  chevron.classList.toggle('open', !isOpen);
}

function setContactMsg(text, ok) {
  var m = document.getElementById('contactMsgEl');
  m.textContent = text;
  m.style.color = ok ? '#7ec850' : '#e07070';
}

async function sendContactEmail() {
  var tr = t();
  var subject = document.getElementById('contactSubject').value.trim();
  var message = document.getElementById('contactMessage').value.trim();
  if (!subject || !message) { setContactMsg(tr.fillSubjectMessage, false); return; }
  var f = student && student.fields || {};
  var btn = document.getElementById('contactSend');
  btn.disabled = true;
  setContactMsg(tr.sending, true);
  try {
    var res = await fetch(PROXY + '?action=sendemail', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({subject: subject, message: message, replyTo: f.email || '', name: f.name || ''})
    }).then(function(r){return r.json();});
    if (res.ok) {
      setContactMsg(tr.messageSent, true);
      document.getElementById('contactSubject').value = '';
      document.getElementById('contactMessage').value = '';
    } else {
      setContactMsg(res.error || tr.failedToSend, false);
    }
  } catch(e) { setContactMsg(tr.networkError, false); }
  btn.disabled = false;
}

(function(){
  applyLang();
  var guestKey = new URLSearchParams(location.search).get('guest');
  if (guestKey) { showGuestDashboard(guestKey); return; }
  try {
    var cached = sessionStorage.getItem('student');
    if (!cached) { window.location.href = BASE + 'login.html'; return; }
    student = JSON.parse(cached);
    var code = sessionStorage.getItem('loginCode');
    if (code) {
      fetch(PROXY + '?action=login', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({code: code})
      }).then(function(r){ return r.json(); }).then(function(res) {
        if (res.ok && res.student && !res.isAdmin) {
          student = res.student;
          sessionStorage.setItem('student', JSON.stringify(student));
          return loadCourseData().then(showDashboard);
        } else {
          sessionStorage.removeItem('loginCode');
          sessionStorage.removeItem('student');
          window.location.href = BASE + 'login.html';
        }
      }).catch(function() {
        if (student) loadCourseData().then(showDashboard);
      });
    } else {
      loadCourseData().then(showDashboard);
    }
  } catch(e) { window.location.href = BASE + 'login.html'; }
})();
</script>
</body>
</html>
